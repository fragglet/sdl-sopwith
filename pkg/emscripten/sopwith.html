<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title> __PACKAGE_STRING__ </title>
    <style>
      :root {
        touch-action: pan-x pan-y;
      }
      body {
        background-color: black;
      }
      canvas.emscripten, #loading {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(5vw, 5vh);
        width: 90vw;
      }
      canvas.emscripten {
        visibility: hidden;
        width: 100vw;
        height: 100vh;
        transform: none;
      }
    </style>

    <meta property="og:title" content="Sopwith" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Play the classic biplane shoot 'em up" />
    <meta property="og:image" content="https://fragglet.github.io/sdl-sopwith/img/start-screen-wide.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Screenshot of the start position of the game Sopwith" />

    <meta name="twitter:title" content="Sopwith">
    <meta name="twitter:description" content="Play the classic biplane shoot 'em up">
    <meta name="twitter:image" content="https://fragglet.github.io/sdl-sopwith/img/start-screen-wide.png">
    <meta name="twitter:image:alt" content="Screenshot of the start position of the game Sopwith">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
  </head>
  <body>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" tabindex=-1></canvas>
    </div>

    <img id="loading" src="loading.gif">

    <script type='text/javascript'>
      function openManual() {
        window.open("doc/sopwith-emscripten.html");
      }
      function promptForInstall() {
        if (installPrompt != null) {
          installPrompt.prompt();
        }
      }
      function programError() {
        canvas.style.visibility = "hidden";
        loadingElement.style.visibility = "visible";
        loadingElement.setAttribute("src", "error.png");
      }
      var progressElement = document.getElementById('progress');
      var loadingElement = document.getElementById('loading');
      var canvas = document.getElementById('canvas');

      function syncFilesystems() {
        FS.syncfs(() => {})
      }

      // fetchURL is a wrapper around fetch() that returns the page text.
      async function fetchURL(url) {
        return fetch(url).then((response) => {
          return response.text()
        })
      }

      // fetchURLs is a wrapper that fetches many URLs.
      async function fetchURLs(urls) {
        var promises = []
        for (const url of urls) {
          promises.push(fetchURL(url))
        }
        return Promise.all(promises)
      }

      // fetchModFiles calls fetchURLs() for URLs given in page URL parameters.
      async function fetchModFiles() {
        var params = new URLSearchParams(window.location.search)
        var urls = []
        for (const [key, val] of params.entries()) {
          if (key == "file") {
            urls.push(val)
          }
        }
        return fetchURLs(urls)
      }

      // This takes any mod files found in the modFiles array, and installs a
      // file in the virtual filesystem for each, adding the appropriate
      // command line arguments to the Module.arguments array so that they be
      // loaded on game startup. The result is that it's possible to load
      // arbitrary mod files from URLs specified using ?file=... when loading
      // the page - as long as same origin policy allows it.
      function installModFiles() {
        var index = 0
        for (const text of modFiles) {
          var filename = "/file" + index + ".sop"
          FS.writeFile(filename, text)
          Module.arguments.push("-m", filename)
          index++
        }
      }

      function mountFilesystems() {
        // The Sopwith configuration file is stored in /libsdl/SDL Sopwith.
        FS.mkdir("/libsdl")
        FS.mount(IDBFS, {}, "/libsdl")
        // We can't start the game until we have synced all the contents of
        // /libsdl from IndexedDB. Because of this, we set a run dependency
        // that defers starting until the callback is invoked.
        addRunDependency("mountFilesystems");
        FS.syncfs(true, () => {
          // We sync the filesystem every 5 seconds.
          setInterval(syncFilesystems, 5000);
          removeRunDependency("mountFilesystems");
          run();
        })
      }

      var Module = {
        arguments: [],
        preRun: [function(){
          canvas.style.visibility = "visible";
          loadingElement.style.visibility = "hidden";
        }, mountFilesystems, installModFiles],
        onAbort: function(x) {
          programError();
        },
        canvas: (function() {
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
            programError();
          }, false);
          return canvas;
        })(),
      };
      window.addEventListener("error", (event) => {
        programError();
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      });
      var installPrompt = null;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
      });
      var modFiles = []
    </script>

    <script type="module">
      // This fetches any mod files referenced in URL parameters using
      // file=... - this is enclosed in a Javascript module to allow this
      // to be done synchronously (as await can be done at the top level
      // of a module). This ensures that when Emscripten starts up, the
      // files are already loaded.
      modFiles = await fetchModFiles();
    </script>

    <script async type="text/javascript" src="sopwith.js"></script>
  </body>
</html>
